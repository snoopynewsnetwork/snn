name: Cloudflare diagnostics
on: workflow_dispatch
permissions:
  contents: read
jobs:
  diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /src/
            /public/
            /scripts/
            /graphics/snn-world-intro/
            /package.json
            /package-lock.json
            /wrangler.jsonc
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Read Worker exceptions without deploying
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npm run cf -- tail --format json &
          snn_tail_pid=$!
          trap 'kill "$snn_tail_pid" 2>/dev/null || true' EXIT
          node --input-type=module <<'JS'
          import {setTimeout as delay} from 'node:timers/promises';
          await delay(10000);
          for(let i=0;i<3;i++) {
            const response=await fetch('https://snoopy-news-network.snoopy-news-network.workers.dev/api/health',{signal:AbortSignal.timeout(10000)});
            console.log('Health:',response.status,await response.text());
            await delay(5000);
          }
          JS
